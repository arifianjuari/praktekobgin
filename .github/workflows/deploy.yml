name: Deploy ke Hostinger via FTP

on:
  push:
    branches:
      - main  # Deploy otomatis saat push ke branch main
      - alpha_v1
      - alpha_v2

  workflow_dispatch:  # Opsi trigger manual di GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Mengambil hanya 2 commit terakhir untuk mempercepat
      
      # Prepare environment files
      - name: Setup env variables
        run: |
          rm -f .env-setup/.env.secret
          mkdir -p .env-setup
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env-setup/.env.secret
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env-setup/.env.secret
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env-setup/.env.secret
          echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}" >> .env-setup/.env.secret

      # Siapkan folder .env-setup yang akan diupload ke server
      - name: Prepare .env-setup directory for server
        run: |
          mkdir -p .env-setup
          cp .github/env-templates/trigger.php .env-setup/trigger.php
          cp .github/env-templates/production.env .env-setup/production.env
          # Simpan token ke file .token agar dibaca oleh trigger.php di server
          printf '%s' "${{ secrets.DEPLOY_TOKEN }}" > .env-setup/.token
          
      # Deploy aplikasi utama via FTP
      - name: Deploy aplikasi via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.SERVER_DIR }} # Contoh: /www/wwwroot/your-domain/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            **/tests/**
            .env
            .env.local
            local.config.env
            config.env
            **/vendor/**
            **/.idea/**
            **/.vscode/**
            **/.github/
            .DS_Store

      # Jalankan script setup via HTTP request (alternatif SSH)
      - name: Trigger environment setup script
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.APP_URL }}/.env-setup/trigger.php # Pastikan APP_URL adalah URL lengkap (http/https)
          method: 'POST'
          customHeaders: '{"Authorization": "${{ secrets.DEPLOY_TOKEN }}"}'
          contentType: application/json
          data: |
            {
              "DB_USER": "${{ secrets.DB_USER }}",
              "DB_PASS": "${{ secrets.DB_PASS }}",
              "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}",
              "OPENAI_MODEL": "${{ secrets.OPENAI_MODEL }}"
            }
          timeout: 10000
          preventFailureOnNoResponse: true
